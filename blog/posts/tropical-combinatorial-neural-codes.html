Classical combinatorial neural coding [1, 2] studies subsets
$\mathcal{C} \subseteq 2^{[n]}$ (*neural codes*, recording which subsets of $n$ neurons
co-fire) through two linked structures: an algebraic one (the neural ring $\mathbb{F}_2[x_1,\dots,x_n]/I_\mathcal{C}$,
whose ideal detects obstructions to convexity) and a geometric one (*convexity*:
realizability as the intersection pattern of convex open sets). My research on this subject aims to
develop the min-plus tropical analogue of both structures.

[1] C. Curto, What can topology tell us about the neural code?, Bull. Amer. Math. Soc. 54 (2017), no. 1, 63-78.<br>
[2] C. Curto, E. Gross, J. Jeffries, K. Morrison, Z. Rosen, A. Shiu, and N. Youngs, Algebraic signatures of convex and non-convex codes, 
J. Pure Appl. Algebra 223 (2019), no. 9, 39193940; arXiv:1807.02741.
